name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NISchal@2006
      POSTGRES_DB: skill-exam-2400030188
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d skill-exam-2400030188"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  exam-service:
    image: nischalsingana/exam-service:latest
    build:
      context: ./soa-task
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "9001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill-exam-2400030188
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: NISchal@2006
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
